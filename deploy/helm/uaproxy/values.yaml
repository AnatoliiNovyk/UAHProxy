replicaCount: 1

frontend:
  image:
    repository: ghcr.io/anatoliinovyk/uaproxy-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80

backend:
  image:
    repository: ghcr.io/anatoliinovyk/uaproxy-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  env:
    PROJECT_NAME: "UAProxy Premium"
    SECRET_KEY: "change_me_to_a_secure_random_key_in_production"
    ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    DATABASE_URL: "postgresql+asyncpg://uaproxy:uaproxypass@uaproxy-postgresql:5432/uaproxy"
    REDIS_URL: "redis://uaproxy-redis-master:6379/0"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: uaproxy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: uaproxy-tls
      hosts:
        - uaproxy.example.com

postgresql:
  enabled: true
  auth:
    username: uaproxy
    password: uaproxypass
    database: uaproxy

redis:
  enabled: true
  auth:
    enabled: false
