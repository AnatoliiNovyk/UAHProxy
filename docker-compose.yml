version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uaproxy_postgres
    restart: always
    environment:
      POSTGRES_DB: uaproxy
      POSTGRES_USER: uaproxy_user
      POSTGRES_PASSWORD: uaproxy_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: uaproxy_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uaproxy_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://uaproxy_user:uaproxy_secret_password@postgres:5432/uaproxy
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-change-in-production-uaproxy
      ENCRYPTION_KEY: gAAAAABl_example_fernet_key_needs_32_bytes_base64=
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uaproxy_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
